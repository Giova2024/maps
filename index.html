<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniMaps</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Roboto, Arial, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 0; }

    /* Top search bar */
    #topbar {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 8px;
      width: min(620px, 92vw);
    }
    #search {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      outline: none;
    }
    .btn {
      border: none;
      background: #fff;
      padding: 0 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 14px;
      color: #1a73e8;
      font-weight: 600;
    }
    .btn:hover { background: #f1f3f4; }

    /* Suggestions dropdown */
    #suggest {
      position: absolute;
      top: 64px; left: 50%;
      transform: translateX(-50%);
      width: min(620px, 92vw);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
      z-index: 1000;
      overflow: hidden;
      display: none;
    }
    #suggest div {
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }
    #suggest div:last-child { border-bottom: none; }
    #suggest div:hover { background: #f1f3f4; }

    /* Floating panels (directions / measure / poi) */
    .panel {
      position: absolute;
      top: 64px; left: 50%;
      transform: translateX(-50%);
      width: min(620px, 92vw);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
      z-index: 1000;
      padding: 12px;
      display: none;
    }
    .panel label { font-size: 12px; color: #555; display: block; margin: 4px 0; }
    .panel input, .panel select {
      width: 100%; padding: 9px 12px; font-size: 14px;
      border: 1px solid #ccc; border-radius: 6px; margin-bottom: 6px; outline: none;
    }
    .panel .row { display: flex; gap: 8px; }
    .panel .row .btn { flex: 1; padding: 10px; }

    /* Favorites panel */
    #favPanel {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 1000;
      width: 260px;
      max-height: 60vh;
      overflow-y: auto;
      background: rgba(255,255,255,.97);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      display: none;
      padding: 10px;
    }
    #favPanel h3 { font-size: 14px; margin-bottom: 8px; color: #333; }
    .favItem {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 6px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 13px;
    }
    .favItem:hover { background: #f1f3f4; }
    .favItem .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .favItem .del {
      border: none; background: none; color: #d93025; cursor: pointer; font-size: 16px; padding: 0 4px;
    }
    #favEmpty { font-size: 13px; color: #777; padding: 6px; }

    /* Side controls */
    #side {
      position: absolute;
      right: 12px;
      bottom: 28px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #side .btn {
      width: 44px; height: 44px;
      padding: 0;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    #side .btn.on { background: #1a73e8; color: #fff; }

    /* Layer switch (bottom-left) */
    #layers {
      position: absolute;
      left: 12px; bottom: 28px;
      z-index: 1000;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      overflow: hidden;
      display: flex;
    }
    #layers button {
      border: none;
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      color: #444;
    }
    #layers button.active { background: #1a73e8; color: #fff; font-weight: 600; }
    #layers button:hover:not(.active) { background: #f1f3f4; }

    /* Info panel */
    #info {
      position: absolute;
      right: 12px; top: 12px;
      z-index: 1000;
      background: rgba(255,255,255,.95);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      font-size: 13px;
      color: #333;
      max-width: 240px;
      display: none;
    }

    @media print {
      #topbar, #side, #layers, #info, #favPanel, .panel, #suggest {
        display: none !important;
      }
      #map { position: absolute; inset: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div id="info"></div>

  <div id="topbar">
    <input id="search" type="text" placeholder="Cerca un luogo…" autocomplete="off" />
    <button class="btn" id="searchBtn">Cerca</button>
  </div>
  <div id="suggest"></div>

  <!-- Directions -->
  <div id="directions" class="panel">
    <label>Da</label>
    <input id="from" type="text" placeholder="Punto di partenza" />
    <label>A</label>
    <input id="to" type="text" placeholder="Destinazione" />
    <div class="row">
      <button class="btn" id="routeGo">Mostra percorso</button>
      <button class="btn" id="routeClear" style="color:#d93025">Cancella</button>
    </div>
  </div>

  <!-- Measure -->
  <div id="measure" class="panel">
    <label>Misuratore di distanza</label>
    <div style="font-size:13px;color:#555;margin-bottom:8px">
      Clicca sulla mappa per aggiungere punti. La distanza totale si aggiorna automaticamente.
    </div>
    <div class="row">
      <button class="btn" id="measureEnd">Fine</button>
      <button class="btn" id="measureClear" style="color:#d93025">Cancella</button>
    </div>
  </div>

  <!-- POI -->
  <div id="poi" class="panel">
    <label>Cerca punti di interesse vicino al centro della mappa</label>
    <select id="poiCat"></select>
    <div class="row">
      <button class="btn" id="poiGo">Cerca qui</button>
      <button class="btn" id="poiClear" style="color:#d93025">Cancella</button>
    </div>
  </div>

  <!-- Favorites -->
  <div id="favPanel">
    <h3>★ Luoghi preferiti</h3>
    <div style="margin-bottom:8px">
      <button class="btn" id="favExport" style="font-size:12px;padding:6px 10px;margin-right:6px">⬇ Esporta</button>
      <button class="btn" id="favImport" style="font-size:12px;padding:6px 10px">⬆ Importa</button>
      <input type="file" id="favFile" accept="application/json" style="display:none" />
    </div>
    <div id="favList"></div>
  </div>

  <div id="side">
    <button class="btn" id="dirBtn" title="Percorso">🧭</button>
    <button class="btn" id="poiBtn" title="Punti di interesse">🔎</button>
    <button class="btn" id="measureBtn" title="Misura distanza">📏</button>
    <button class="btn" id="shareBtn" title="Condividi posizione">🔗</button>
    <button class="btn" id="favBtn" title="Preferiti">★</button>
    <button class="btn" id="gpsBtn" title="Tracciamento GPS live">🚶</button>
    <button class="btn" id="locate" title="La mia posizione">📍</button>
    <button class="btn" id="printBtn" title="Stampa mappa">🖨️</button>
    <button class="btn" id="reset" title="Reimposta">🗺️</button>
  </div>

  <div id="layers">
    <button data-layer="street" class="active">Strade</button>
    <button data-layer="sat">Satellite</button>
    <button data-layer="dark">Scuro</button>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // ---------- Map setup ----------
    const map = L.map('map', { zoomControl: false }).setView([41.9028, 12.4964], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.scale({ position: 'bottomright' }).addTo(map);

    // Tile layers
    const layers = {
      street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { maxZoom: 19, attribution: '© OpenStreetMap' }),
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19, attribution: '© Esri' }),
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        { maxZoom: 19, attribution: '© CARTO' })
    };
    let currentLayer = 'street';
    layers.street.addTo(map);

    // Layer groups
    const markers = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);
    const measureLayer = L.layerGroup().addTo(map);
    const poiLayer = L.layerGroup().addTo(map);

    // ---------- Markers ----------
    function addMarker(lat, lng, label, saveable) {
      const m = L.marker([lat, lng]).addTo(markers);
      if (label) {
        let html = `<div style="max-width:220px">${label}`;
        if (saveable) html += `<br><a href="#" class="saveFav" data-lat="${lat}" data-lng="${lng}" data-label="${label.replace(/"/g,'')}">★ Salva nei preferiti</a>`;
        html += `</div>`;
        m.bindPopup(html);
      }
      return m;
    }

    // ---------- Measure mode ----------
    let measureMode = false;
    let measurePts = [];

    function addMeasurePoint(latlng) {
      measurePts.push(latlng);
      redrawMeasure();
    }
    function redrawMeasure() {
      measureLayer.clearLayers();
      if (measurePts.length < 1) { hideInfo(); return; }
      const latlngs = measurePts;
      L.polyline(latlngs, { color: '#e8710a', weight: 3, dashArray: '6,6' }).addTo(measureLayer);
      measurePts.forEach((p, i) =>
        L.circleMarker(p, { radius: 5, color: '#e8710a', fillColor: '#fff', fillOpacity: 1 })
          .addTo(measureLayer).bindTooltip(`Punto ${i + 1}`));
      let total = 0;
      for (let i = 1; i < measurePts.length; i++)
        total += map.distance(measurePts[i - 1], measurePts[i]);
      const txt = total >= 1000 ? `${(total / 1000).toFixed(2)} km` : `${Math.round(total)} m`;
      showInfo(`📏 Distanza: <b>${txt}</b> (${measurePts.length} punti)`);
    }

    map.on('click', (e) => {
      if (measureMode) { addMeasurePoint(e.latlng); return; }
      addMarker(e.latlng.lat, e.latlng.lng,
        `📌 ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`, true);
    });

    // Save favorite from popup link
    map.on('popupopen', (e) => {
      const a = e.popup.getElement().querySelector('.saveFav');
      if (a) a.onclick = (ev) => {
        ev.preventDefault();
        saveFavorite(parseFloat(a.dataset.lat), parseFloat(a.dataset.lng), a.dataset.label);
        alert('Salvato nei preferiti!');
      };
    });

    // ---------- Search + suggestions (Nominatim) ----------
    const searchEl = document.getElementById('search');
    const suggestEl = document.getElementById('suggest');
    let debounce;

    async function geocode(q) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      return res.json();
    }

    function showSuggestions(list) {
      suggestEl.innerHTML = '';
      if (!list.length) { suggestEl.style.display = 'none'; return; }
      list.forEach(item => {
        const d = document.createElement('div');
        d.textContent = item.display_name;
        d.onclick = () => {
          const lat = parseFloat(item.lat), lng = parseFloat(item.lon);
          map.setView([lat, lng], 15);
          addMarker(lat, lng, item.display_name, true);
          suggestEl.style.display = 'none';
          searchEl.value = item.display_name.split(',')[0];
        };
        suggestEl.appendChild(d);
      });
      suggestEl.style.display = 'block';
    }

    searchEl.addEventListener('input', () => {
      const q = searchEl.value.trim();
      clearTimeout(debounce);
      if (q.length < 3) { suggestEl.style.display = 'none'; return; }
      debounce = setTimeout(async () => {
        const data = await geocode(q);
        showSuggestions(data);
      }, 400);
    });

    async function doSearch() {
      const q = searchEl.value.trim();
      if (!q) return;
      const data = await geocode(q);
      if (data.length) {
        const item = data[0];
        const lat = parseFloat(item.lat), lng = parseFloat(item.lon);
        map.setView([lat, lng], 15);
        addMarker(lat, lng, item.display_name, true);
        suggestEl.style.display = 'none';
      } else alert('Nessun risultato trovato.');
    }
    document.getElementById('searchBtn').onclick = doSearch;
    searchEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
    document.addEventListener('click', (e) => {
      if (!suggestEl.contains(e.target) && e.target !== searchEl)
        suggestEl.style.display = 'none';
    });

    // ---------- Layer switch ----------
    document.querySelectorAll('#layers button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#layers button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        map.removeLayer(layers[currentLayer]);
        currentLayer = btn.dataset.layer;
        layers[currentLayer].addTo(map);
      };
    });

    // ---------- Locate me ----------
    document.getElementById('locate').onclick = () => {
      if (!navigator.geolocation) { alert('Geolocalizzazione non supportata.'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude: lat, longitude: lng } = pos.coords;
          map.setView([lat, lng], 15);
          addMarker(lat, lng, '📍 La tua posizione', true);
        },
        () => alert('Impossibile ottenere la posizione.')
      );
    };

    // ---------- Reset ----------
    document.getElementById('reset').onclick = () => {
      markers.clearLayers();
      routeLayer.clearLayers();
      measureLayer.clearLayers();
      poiLayer.clearLayers();
      measurePts = [];
      measureMode = false;
      if (watchId !== null) stopGps();
      document.getElementById('measureBtn').classList.remove('on');
      map.setView([41.9028, 12.4964], 6);
      hideInfo();
    };

    // ---------- Info panel ----------
    const infoEl = document.getElementById('info');
    function showInfo(text) { infoEl.innerHTML = text; infoEl.style.display = 'block'; }
    function hideInfo() { infoEl.style.display = 'none'; }

    // ---------- Directions (OSRM) ----------
    const dirPanel = document.getElementById('directions');
    document.getElementById('dirBtn').onclick = () => {
      togglePanel(dirPanel, document.getElementById('dirBtn'));
    };

    document.getElementById('routeClear').onclick = () => {
      routeLayer.clearLayers();
      hideInfo();
      document.getElementById('from').value = '';
      document.getElementById('to').value = '';
    };

    document.getElementById('routeGo').onclick = async () => {
      const fromQ = document.getElementById('from').value.trim();
      const toQ = document.getElementById('to').value.trim();
      if (!fromQ || !toQ) { alert('Inserisci partenza e destinazione.'); return; }

      const [fromData, toData] = await Promise.all([geocode(fromQ), geocode(toQ)]);
      if (!fromData.length || !toData.length) { alert('Luoghi non trovati.'); return; }

      const from = [parseFloat(fromData[0].lat), parseFloat(fromData[0].lon)];
      const to = [parseFloat(toData[0].lat), parseFloat(toData[0].lon)];

      const url = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || !data.routes.length) { alert('Percorso non disponibile.'); return; }
        const r = data.routes[0];
        const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
        routeLayer.clearLayers();
        L.polyline(coords, { color: '#1a73e8', weight: 5, opacity: .8 }).addTo(routeLayer);
        L.marker(from).addTo(routeLayer).bindPopup('🟢 Partenza');
        L.marker(to).addTo(routeLayer).bindPopup('🔴 Arrivo');
        map.fitBounds(L.polyline(coords).getBounds(), { padding: [40, 40] });
        const km = (r.distance / 1000).toFixed(1);
        const min = Math.round(r.duration / 60);
        showInfo(`🚗 <b>${km} km</b> · circa <b>${min} min</b>`);
      } catch (err) {
        alert('Errore nel calcolo del percorso.');
      }
    };

    // ---------- Measure ----------
    const measurePanel = document.getElementById('measure');
    const measureBtn = document.getElementById('measureBtn');
    measureBtn.onclick = () => {
      measureMode = !measureMode;
      measureBtn.classList.toggle('on', measureMode);
      togglePanel(measurePanel, measureBtn, !measureMode);
      if (measureMode) showInfo('📏 Modalità misura: clicca i punti sulla mappa.');
      else if (measurePts.length === 0) hideInfo();
    };
    document.getElementById('measureEnd').onclick = () => {
      measureMode = false;
      measureBtn.classList.remove('on');
      measurePanel.style.display = 'none';
    };
    document.getElementById('measureClear').onclick = () => {
      measurePts = [];
      measureLayer.clearLayers();
      hideInfo();
    };

    // ---------- POI search (Overpass) ----------
    const POI = [
      { type: 'amenity', key: 'restaurant', label: 'Ristoranti' },
      { type: 'amenity', key: 'cafe', label: 'Bar / Caffè' },
      { type: 'amenity', key: 'fuel', label: 'Benzinai' },
      { type: 'tourism', key: 'hotel', label: 'Hotel' },
      { type: 'amenity', key: 'hospital', label: 'Ospedali' },
      { type: 'shop', key: 'supermarket', label: 'Supermercati' },
      { type: 'amenity', key: 'pharmacy', label: 'Farmacie' },
      { type: 'amenity', key: 'school', label: 'Scuole' }
    ];
    const poiCat = document.getElementById('poiCat');
    POI.forEach(p => {
      const o = document.createElement('option');
      o.value = `${p.type}|${p.key}`; o.textContent = p.label;
      poiCat.appendChild(o);
    });
    const poiPanel = document.getElementById('poi');
    document.getElementById('poiBtn').onclick = () => togglePanel(poiPanel, document.getElementById('poiBtn'));

    document.getElementById('poiGo').onclick = async () => {
      const [type, key] = poiCat.value.split('|');
      const c = map.getCenter();
      const radius = 2000;
      const q = `[out:json][timeout:25];(node["${type}"="${key}"](around:${radius},${c.lat},${c.lng}););out body 50;`;
      showInfo('🔎 Ricerca in corso…');
      try {
        const res = await fetch('https://overpass-api.de/api/interpreter',
          { method: 'POST', body: new URLSearchParams({ data: q }) });
        const data = await res.json();
        poiLayer.clearLayers();
        const bounds = [];
        let n = 0;
        data.elements.forEach(el => {
          if (el.lat == null) return;
          const name = el.tags && el.tags.name ? el.tags.name : 'Senza nome';
          L.marker([el.lat, el.lon]).addTo(poiLayer).bindPopup(`🔎 ${name}`);
          bounds.push([el.lat, el.lon]);
          n++;
        });
        if (n === 0) showInfo('🔎 Nessun risultato nelle vicinanze.');
        else {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
          showInfo(`🔎 Trovati <b>${n}</b> risultati.`);
        }
      } catch (err) {
        showInfo('🔎 Errore nella ricerca.');
      }
    };
    document.getElementById('poiClear').onclick = () => {
      poiLayer.clearLayers();
      hideInfo();
    };

    // ---------- Favorites (localStorage) ----------
    const favPanel = document.getElementById('favPanel');
    const favList = document.getElementById('favList');
    const FAV_KEY = 'minimaps_favorites';

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
      catch { return []; }
    }
    function saveFavorite(lat, lng, label) {
      const favs = getFavorites();
      if (favs.some(f => f.lat === lat && f.lng === lng)) return;
      favs.push({ lat, lng, label });
      localStorage.setItem(FAV_KEY, JSON.stringify(favs));
      renderFavorites();
    }
    function renderFavorites() {
      const favs = getFavorites();
      favList.innerHTML = '';
      if (!favs.length) {
        favList.innerHTML = '<div id="favEmpty">Nessun preferito salvato.</div>';
        return;
      }
      favs.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'favItem';
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = f.label.split(',')[0] || f.label;
        const del = document.createElement('button');
        del.className = 'del'; del.textContent = '×';
        del.onclick = (e) => {
          e.stopPropagation();
          const cur = getFavorites();
          cur.splice(i, 1);
          localStorage.setItem(FAV_KEY, JSON.stringify(cur));
          renderFavorites();
        };
        item.appendChild(name);
        item.appendChild(del);
        item.onclick = () => {
          map.setView([f.lat, f.lng], 15);
          addMarker(f.lat, f.lng, f.label, true);
          favPanel.style.display = 'none';
        };
        favList.appendChild(item);
      });
    }
    renderFavorites();
    document.getElementById('favBtn').onclick = () => {
      favPanel.style.display = favPanel.style.display === 'block' ? 'none' : 'block';
    };

    // ---------- Share link ----------
    document.getElementById('shareBtn').onclick = async () => {
      const c = map.getCenter();
      const base = location.href.split('?')[0].split('#')[0];
      const link = `${base}?lat=${c.lat.toFixed(5)}&lng=${c.lng.toFixed(5)}&z=${map.getZoom()}`;
      const ok = await copyText(link);
      if (ok) showInfo(`🔗 Link copiato negli appunti!<br><span style="font-size:11px;word-break:break-all">${link}</span>`);
      else showInfo(`🔗 Copia manualmente:<br><span style="font-size:11px;word-break:break-all">${link}</span>`);
    };
    async function copyText(t) {
      try { await navigator.clipboard.writeText(t); return true; }
      catch {
        try {
          const ta = document.createElement('textarea');
          ta.value = t; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
          return true;
        } catch { return false; }
      }
    }

    // ---------- Live GPS tracking ----------
    let watchId = null, gpsMarker = null;
    const gpsBtn = document.getElementById('gpsBtn');
    gpsBtn.onclick = () => {
      if (watchId !== null) { stopGps(); return; }
      if (!navigator.geolocation) { alert('Geolocalizzazione non supportata.'); return; }
      gpsBtn.classList.add('on');
      showInfo('🚶 Tracciamento GPS attivo…');
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          if (!gpsMarker) {
            gpsMarker = L.marker([lat, lng]).addTo(map);
            map.setView([lat, lng], 16);
          } else {
            gpsMarker.setLatLng([lat, lng]);
          }
          gpsMarker.bindPopup(`🚶 Sei qui<br>${lat.toFixed(5)}, ${lng.toFixed(5)}`).openPopup();
          map.panTo([lat, lng]);
        },
        () => { alert('GPS non disponibile.'); stopGps(); },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    };
    function stopGps() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; }
      gpsBtn.classList.remove('on');
      hideInfo();
    }

    // ---------- Favorites export / import ----------
    document.getElementById('favExport').onclick = () => {
      const blob = new Blob([JSON.stringify(getFavorites(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'preferiti.json'; a.click();
      URL.revokeObjectURL(url);
    };
    document.getElementById('favImport').onclick = () => document.getElementById('favFile').click();
    document.getElementById('favFile').onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const arr = JSON.parse(reader.result);
          const cur = getFavorites();
          arr.forEach(f => {
            if (f.lat != null && f.lng != null && !cur.some(c => c.lat === f.lat && c.lng === f.lng))
              cur.push(f);
          });
          localStorage.setItem(FAV_KEY, JSON.stringify(cur));
          renderFavorites();
        } catch { alert('File non valido.'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    // ---------- Print ----------
    document.getElementById('printBtn').onclick = () => window.print();

    // ---------- Panel helper ----------
    function togglePanel(panel, btn, forceClose) {
      const open = panel.style.display === 'block';
      // close all panels and deactivate toggles
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.querySelectorAll('#side .btn').forEach(b => b.classList.remove('on'));
      if (open || forceClose) return; // was open -> just close
      panel.style.display = 'block';
      if (btn) btn.classList.add('on');
    }

    // ---------- Deep link on load ----------
    (function () {
      const p = new URLSearchParams(location.search);
      if (p.has('lat') && p.has('lng')) {
        const lat = parseFloat(p.get('lat'));
        const lng = parseFloat(p.get('lng'));
        const z = parseInt(p.get('z')) || 12;
        if (!isNaN(lat) && !isNaN(lng)) {
          map.setView([lat, lng], z);
          addMarker(lat, lng, '📍 Posizione condivisa', true);
        }
      }
    })();
  </script>
</body>
</html>
